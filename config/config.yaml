# Конфигурация mm-standx. Единственная: этот файл едет на сервер и по нему
# торгует бот, других конфигураций в репозитории нет.
#
# Окружение не переопределяет ничего. Из него приходят ровно две вещи, и обе —
# не настройки стратегии:
#
#   STANDX_WALLET_PK — приватный ключ; задать его здесь нельзя, попытка
#                      приведёт к отказу загрузки;
#   MM_MODE          — dry_run | live. В файле не принимается намеренно:
#                      файл одинаков везде, где его запускают, а строка
#                      `mode: live` в нём означала бы, что любой локальный
#                      прогон на машине с рабочим ключом отправляет настоящие
#                      ордера. Незаданная переменная означает dry_run.
#
# Неизвестные ключи считаются ошибкой: опечатка не должна молча вернуть значение
# по умолчанию.
#
# В образ файл не запекается. На сервере он лежит рядом с docker-compose.yml,
# в каталоге config/, и подключается томом. Значит, параметр правится на месте:
#
#   vim /root/opt/mm-standx/config/config.yaml
#   docker compose --project-directory /root/opt/mm-standx restart mmbot
#
# Правка живёт до следующего деплоя: CI кладёт сюда версию из репозитория.
# Изменение, которое должно пережить деплой, коммитится.

runtime:
  logLevel: info
  logFormat: json # json для разбора, text для чтения глазами
  # A copy of the log on disk, next to this file. Stdout keeps working: this is
  # an addition, not a move, and `docker logs` stays the quick answer.
  #
  # The container's own json-file driver writes under /var/lib/docker, owned by
  # root and named after the container id — a bad place to be looking things up
  # during an incident, and `docker compose down` takes it along. This path is
  # mounted from the host, so scp reaches it and a recreated container does not
  # lose the history.
  #
  # Bounded because a full disk kills the process while it is holding orders in
  # the market: at most logMaxSizeMb * (logMaxFiles + 1) = 550 MB. Around 20 MB
  # a day of process log, so roughly a month fits before the oldest is dropped.
  logFile: logs/mmbot.log
  logMaxSizeMb: 50
  logMaxFiles: 10
  metricsAddr: ":9090"
  heartbeatPath: data/mmbot.hb
  # Запись сырого потока для повторного разбора. В бою выключена: даёт около
  # 100 МБ в час на инструмент и нужна только для пересчёта профиля риска.
  recordingDir: ""
  statsInterval: 30s
  # Снимки защитного контура. Пустое значение допустимо только в теневом режиме:
  # счётчик убытка, обнуляемый перезапуском, не защищает ни от чего.
  stateDir: data/state
  # Почасовая свёртка показателей: один файл на сутки, забирается по ssh.
  # Реестр в памяти отвечает по HTTP только мгновенным снимком.
  statsDir: data/stats
  statsSample: 15s
  # Какие инструменты торговать, задаётся флагами enabled в блоке symbols ниже.
  # Второго способа сказать то же самое здесь больше нет.

exchange:
  authBaseUrl: https://api.standx.com
  restBaseUrl: https://perps.standx.com
  wsStreamUrl: wss://perps.standx.com/ws-stream/v1
  wsApiUrl: wss://perps.standx.com/ws-api/v1
  chain: bsc
  tokenTtl: 24h
  tokenRefreshLead: 2h
  wsRotateAfter: 20h # биржа рвёт соединение на 24-м часе
  wsReconnectMin: 250ms
  wsReconnectMax: 30s
  # Живость определяется по молчанию, а не пингом: сервер StandX на клиентские
  # ping не отвечает, и активная проверка рвала бы исправное соединение.
  wsIdleTimeout: 30s
  wsHeartbeatInterval: 10s
  requestTimeout: 5s

rateLimit:
  sustainedRps: 15 # биржевой предел ~22, оставляем запас
  burst: 12
  safetyReservePct: 30 # доля бакета, доступная только командам безопасности

# Параметры программы наград StandX. Вынесены в конфиг, потому что биржа меняет
# их без предупреждения.
#
# ПРОТИВОРЕЧИЕ В ДОКУМЕНТАЦИИ ЗАКРЫТО ЗАМЕРОМ, НЕ ЧТЕНИЕМ. Страница кампании
# объявляет max_weight = 200% и приводит формулу, дающую те же 200%, но одна
# строка её таблицы (5 bps → 80%) отвечает кривой со 120%. Здесь стояло 120,
# то есть выбрана была таблица против формулы.
#
# Прежнее значение опиралось на сверку 6 августа, но та шла на микроразмере:
# зачтённые величины были шириной 0.02 единицы и двух кривых не различали.
#
# ОТЧЁТ ЗА 18 АВГУСТА РАЗЛИЧАЕТ — И НЕ ОЦЕНКОЙ, А ВЕРХНЕЙ ГРАНИЦЕЙ. За часы
# 09-12 UTC актор ни разу не планировал больше 87.402 единиц на сторону и ни
# разу не ставил ступень ближе 7.0 bps. Значит на кривой 120 взвешенная
# сторона физически не может превысить
#
#   87.402 × weight120(7.0) = 87.402 × 0.64 = 55.94
#
# при любом аптайме и любом расположении ступеней. StandX опубликовал за те же
# часы P50 = 74.25…78.09 и P70 = 68.80…72.20. Кривая 120 этих чисел не даёт
# ни при каких условиях; кривая 200 даёт потолок 87.402 × 0.88 = 76.91
# и накрывает наблюдения.
#
# НЕ ВОЗВРАЩАТЬ 120 БЕЗ ОТЧЁТА БИРЖИ, ЛОМАЮЩЕГО ЭТУ ГРАНИЦУ. Цена ошибки не
# в отчётности, а в размере: sizing.usefulCeiling делит перекрытие на вес,
# и заниженный вес заставлял держать на стороне примерно на 20% больше, чем
# зачёт способен принять. Излишек не приносил ничего, нёс полный риск
# исполнения и съедал маржу — 18 августа биржа отклонила 1449 ордеров
# с «balance not enough».
#
# ПОБОЧНОЕ НАБЛЮДЕНИЕ, ЗАФИКСИРОВАННОЕ ТЕМ ЖЕ РАЗБОРОМ. Посекундная
# реконструкция стакана по логу даёт P70 заметно ниже опубликованного даже
# на кривой 200. Расхождение объясняется частотой замеров: биржа семплирует
# реже нашей односекундной сетки и не видит коротких разрывов между cancel
# и place. То есть собственная оценка аптайма пессимистичнее биржевой —
# инвариант PLAN.md §4.9 п.5 нарушен в безопасную сторону, но нарушен.
reward:
  bandBps: 10
  maxWeightPct: 200
  minWeightPct: 40
  uptimeTiers:
    - { thresholdPct: 70, multiplier: 1.0 }
    - { thresholdPct: 50, multiplier: 0.5 }

risk:
  # Лимиты применяются защитным контуром (internal/app/risk). Дневной убыток
  # считается по данным биржи и независимо по модели стоимости; принимается
  # худшая из двух оценок. Взведённая остановка переживает перезапуск.
  # На время калибровки — доля депозита, а не круглое число: при 95 DUSD
  # на счёте лимит в 500 не сработал бы никогда.
  #
  # 60 при аллокации 8000. Считано от измеренного, а не назначено: 14 августа
  # при размере 4.3 XAU на сторону сутки стоили 1.50 USD, а новая аллокация
  # поднимает размер в 7.8 раза — то есть обычные сутки обойдутся примерно
  # в 12 USD. Предел обязан быть заметно выше обычного дня и заметно ниже
  # сломанного: эта защёлка переживает перезапуск, и сработать на рядовой
  # волатильности значит потерять начисление вместо того, чтобы предотвратить
  # убыток.
  #
  # Лимит меряет полную стоимость, а не движение цены, и разница здесь
  # в разы. Канал `trade` StandX не несёт комиссии (см. wsstream.handleTrade),
  # поэтому она достраивается из `fees` ниже — и достраивается верно. Сверено
  # 28 августа по `query_trades`, где комиссия приходит фактическая: на 76
  # сделках с 19 августа ставка ни разу не отклонилась от 1.00 bps мейкером
  # и 4.00 bps тейкером, а эпизод 27 августа сошёлся до четвёртого знака —
  # поток денег −16.9327, комиссия 54.3813, итого −71.3140 против −71.3140
  # в риск-леджере. Модель проверена фактом, а не спецификацией.
  #
  # Интерфейс биржи показывает другую величину: поле `pnl` у сделок — это
  # движение цены без комиссии. Накопленные −18.43, которые видно в кабинете,
  # это сумма `pnl` за всё время, а не стоимость одного эпизода.
  #
  # Отсюда главное следствие для этого числа: при ступени в 22.7 XAU
  # (≈105 000 USD нотионала) полный свип со встречным закрытием стоит одних
  # комиссий 5 bps ≈ 52 USD, то есть 87% предела ещё до того, как цена куда-то
  # сдвинулась. Любой свип целой ступени взводит остановку. Предел придётся
  # либо поднимать, либо резать размер ступени — но не тем и не другим сразу
  # с расчётом, что защита останется осмысленной.
  maxDailyLossUsd: 60
  # Сколько остановка по дневному убытку держится, прежде чем снимется сама.
  #
  # Ноль возвращает прежнее поведение — до полуночи UTC. Оно и стоило суток
  # присутствия 27 августа: свип одной ступени в 14:46 UTC дал 71 USD при
  # пределе 60 и снял котирование на 9 ч 14 мин. Защита сработала по замыслу,
  # но цена ответа не имела отношения к цене события — убыток был разовым
  # и уже реализованным, а платили за него присутствием до полуночи.
  #
  # 90 минут — это заметно дольше самого события (свип и закрытие уложились
  # в две секунды) и заметно короче остатка суток. Смысл паузы в том, чтобы
  # человек успел посмотреть, а не в том, чтобы переждать причину: причина
  # к этому моменту уже реализована.
  killSwitchCooldown: 90m
  # Сколько раз за сутки UTC остановка снимается сама.
  #
  # Снятие переносит начало отсчёта убытка на момент снятия — иначе первая же
  # оценка увидела бы ту же величину и взвела остановку снова. Это превращает
  # дневной предел в оконный, и ограничивает сутки уже не он, а это число:
  # худший день стоит (3+1) × 60 = 240 USD, после чего остановка снова держится
  # до полуночи. Четыре срабатывания за сутки — это уже не рыночное событие,
  # а неверная модель дистанции, и разбирать её должен человек.
  killSwitchMaxAutoResumes: 3
  # Доля equity, которую разрешено держать заблокированной под котировками.
  #
  # Прежде жила константой в коде актора, минуя файл и, соответственно, любую
  # правку без пересборки образа — единственный предел риска в проекте с такой
  # судьбой.
  #
  # Опасение, ради которого держали запас: reduce_only-закрытие после залива
  # потребует маржи сверх уже заблокированной и не пройдёт при высокой
  # утилизации. 14 августа проверено на шести живых заливах — available_usd
  # во всех шести вырос сразу после закрытия (например 899→1092, 10114→11087),
  # ни разу не просел и не ушёл в отказ. Прямого измерения "сколько держит
  # сам reduce_only" это не даёт: закрытие уходит короче такта сводки в 250 мс,
  # и промежуточное состояние снимком не застать. Но reduce_only по смыслу
  # уменьшает экспозицию, а не создаёт её, и все шесть наблюдений ведут себя
  # так, как если бы он маржу не занимал, а освобождал.
  #
  # Формального подтверждения из документации StandX нет. Практическим
  # ограничителем на этом уровне утилизации всё равно служат perSideCap
  # программы и физический пол 1/leverage — они срабатывают раньше, чем
  # успела бы проявиться нехватка маржи.
  # Здесь стояло 95, то есть запаса маржи не было вовсе: бюджет 19 192 USD
  # при equity 20 202. Отсюда 1449 отказов «balance not enough» за 18 августа
  # и вместе с ними дыры в присутствии — отклонённая ступень в стакане
  # не стоит, а зачёт считается перцентилем и дыр не прощает.
  #
  # Настоящую защиту даёт не это число, а исправленная кривая веса: потолок
  # sizing.usefulCeiling = perSideCap / weight больше не зависит от измеренной
  # ставки маржи, которая 18 августа гуляла от 1.52% до 6.00% и при низком
  # замере разрешала просить вдвое больше, чем счёт тянет.
  #
  # Остаток нужен под закрывающий ордер: после залива он требует маржи под
  # позицию, и при полной утилизации может не пройти.
  #
  # Снижено с 85 по замеру 28 августа 2026. Ступень на счёте в 20596 USD
  # весила около 23.8 XAU, то есть 109 500 USD нотионала, и позиция после
  # её залива занимает при ставке 2.9% примерно 3175 USD. При 85% свободными
  # оставались 3089 — закрытие одной залитой ступени не помещалось. При 80%
  # остаётся 4119, то есть проходит с запасом около 30%.
  #
  # Второй эффект прямой: убыток от залива пропорционален размеру. Заливы
  # 16:22 и 16:23 были на 10 XAU каждый — 45 000 USD нотионала, — и при
  # движении 3.5 bps это 35 USD с одного.
  utilizationPct: 80
  # Потолка нотионала здесь больше нет, и это не упущение.
  #
  # Он проверялся на старте как allocationUsd × leverage, то есть выводился
  # из настроенной суммы. Суммы больше нет: бюджет считается от equity счёта
  # (sizing.Budget), а значит экспозиция ограничена самим балансом и потолком
  # программы наград (perSideCap) — обе величины известны в рантайме и ни одна
  # не задаётся здесь. Статическая проверка от снятого числа проверяла бы
  # величину, которой торговля не пользуется.
  #
  # Ограничением на деньги остаётся maxDailyLossUsd выше: он меряет результат,
  # а не размер, и потому не устаревает при смене баланса.
  # Не денежный лимит, а детектор рассогласования модели с рынком: стратегия
  # построена на том, что исполнения редки.
  #
  # Reaching it pauses quoting until the episodes leave the sliding hour; it
  # does not arm the kill switch. It used to, and that was the wedge: the
  # measured condition expired an hour later, the flag lasted until midnight
  # UTC, and it survived the restart meant to clear it.
  maxFillsPerHour: 18
  # Ставки StandX, одинаковые для всех рынков. Нужны для независимой оценки
  # стоимости залива, см. PLAN.md §1.3.
  fees: { makerBps: 1, takerBps: 4 }
  marginMode: isolated # isolated изолирует риск между инструментами
  flattenPolicy: immediate_market
  # Every observed fill delta is closed immediately. Zero also makes the
  # position-based fallback retry as soon as a PositionUpdated event arrives.
  flattenDebounce: 0ms
  postFillCooldown: 3s
  # Four independent fill episodes in ten minutes indicate a temporary regime
  # mismatch. Step away, then re-evaluate current data; this is deliberately
  # self-resetting and does not wedge the bot for the day.
  #
  # Raised from two, and the cooldown cut from three minutes to two: the
  # reference bot takes far more fills over the same volume and earns more for
  # it, so two episodes was catching ordinary flow, not a regime break.
  #
  # Two minutes, not twenty. Accrual is tiered, so idling costs nothing while
  # presence stays above the tier threshold and costs the whole hour one step
  # past it. During calibration only the 1.0x tier is eligible, which leaves
  # about 28% of the hour — under 17 minutes — to spend in total. A twenty
  # minute pause therefore did not merely cost more than intended: it lost the
  # hour outright, after which uptime.Lost withdrew the quotes for whatever
  # remained. The engine now also clamps this to whatever the hour can still
  # absorb (Engine.burstCooldown); the configured value should not be relying
  # on that clamp.
  fillBurstLimit: 4
  fillBurstWindow: 10m
  fillBurstCooldown: 2m
  killSwitchOnDrawdown: true

health:
  # Канал price обновляется примерно раз в 3 секунды — заметно реже стакана.
  # Порог даёт запас на три пропущенных обновления; уточняется по записи.
  markStale: 10s
  # Насколько ориентиру позволено разойтись с последним тактом mark, чтобы уже
  # стоящие котировки не снимались.
  #
  # Молчащий канал mark — не то же самое, что движущийся рынок, и общего ответа
  # у них быть не должно. Замер 18 августа 2026: канал замолкал на 10-12 секунд
  # подряд, 1514 съёмов за сутки по причине stale_mark, час 06:00 UTC закрылся
  # нулём Maker Hours при открытом и спокойном рынке. Это около 3.2 из 5.5
  # потерянных за день Maker Hours — заплачено за чужой график публикаций,
  # а не за движение цены.
  #
  # Половина полосы награды: смещение в этих пределах не выводит уже стоящую
  # ступень из зачёта и не подводит её к касанию. Удерживаются ТОЛЬКО висящие
  # ордера — выставлять по устаревшему mark по-прежнему запрещено. Ноль
  # возвращает безусловный съём.
  markStaleHoldBps: 5
  reconcileInterval: 5s
  ackTimeout: 2s
  heartbeatInterval: 1s

# Наследуется каждым инструментом; ниже переопределяются только отличия.
# Blackout around scheduled economic releases — the only guard in the loop that
# acts ahead of the move rather than in response to it. Everything else answers
# a move already under way; against a release whose time is published in advance
# that does not work at all, because a cancel takes about 400 ms round trip and
# gold covers tens of basis points in the first second of a CPI print.
news:
  enabled: true
  url: "" # empty uses the published weekly feed
  # Событие без валюты (метка All в фиде — симпозиум, саммит, встреча) проходит
  # этот список независимо от его содержимого: оно не про чужую валюту, оно
  # про все сразу. См. calendar.Filter.Match и замер 28 августа.
  currencies: [USD] # what the traded instruments actually react to
  impacts: [high] # an empty list matches nothing, deliberately
  # Окна расширены 28 августа 2026, и расширены по факту, а не для симметрии.
  #
  # Прежние значения — 15 минут защиты и 4 минуты отсутствия — описывают ПЕЧАТЬ
  # ЧИСЛА: публикация в назначенную секунду, движение в первую, спор в следующую
  # четверть часа. Для выступления и симпозиума эта форма неверна. Jackson Hole
  # 28 августа стоял в фиде на 16:15; заливы пришли в 16:22 и 16:23, то есть
  # через семь и восемь минут после начала — внутри события, но уже за пределами
  # прежнего hardAfter в три минуты. Актор к тому моменту вернулся бы в стакан.
  #
  # Что дают новые окна на том же эпизоде: отсутствие с 16:10 по 16:30 покрывает
  # оба дорогих залива целиком, а защитная поза с 15:45 — ещё один, в 15:56,
  # половинным размером и у внешнего края.
  #
  # Цена считается и мала. Событий, проходящих фильтр, около пяти в неделю;
  # каждое стоит 20 минут вне стакана и 40 минут защитной позы. Это порядка
  # 100 минут отсутствия на неделю в 10 080 минут — около одного процента.
  # Защитная поза отсутствием не является вовсе: она держит час оплачиваемым.
  defensiveBefore: 30m
  defensiveAfter: 30m
  # Отсутствие вокруг самого события: единственный отрезок, где безопасной
  # дистанции внутри полосы награды не существует.
  #
  # Асимметрия намеренная. До события известна только его минута, и пяти минут
  # хватает, чтобы уйти из стакана и не возвращаться на истончающемся стакане.
  # После — движение уже идёт, и его длительность заранее не известна ничем;
  # пятнадцать минут покрывают и печать числа, и первую часть выступления.
  hardBefore: 5m
  hardAfter: 15m
  # Standing back is not the same as leaving. The programme scores a percentile
  # of the samples, so half an hour of zeros drags the whole hour down a tier
  # or past it, while the same half hour spent at the outer edge of the band
  # keeps the hour payable and still cuts the loss if the move arrives early.
  defensiveInsetBps: 1.5 # room inside the band edge; the 0.8 bps ladder still fits
  defensiveSizeMultiple: 0.5 # free in accrual terms, proportional in loss terms
  refresh: 2h
  maxAge: 6h
  timeout: 15s
  # An unavailable publisher is not a reason to stop for a day: the weekly file
  # covers the week ahead, and the known releases stay true. Set false to refuse
  # to quote until the calendar is confirmed.
  failOpen: true

defaults:
  enabled: false
  economics:
    # Этими двумя числами шлюз решает, окупается ли присутствие вообще, и они
    # единственное, что осталось от контроля размера.
    #
    # КАЛИБРОВКА ЗАКОНЧЕНА. Здесь стоял ноль — «ставка пула ещё не измерена», —
    # и он делал ровно одну вещь: MinimumTierMultiplier возвращал 1, то есть
    # тир 0.5x объявлялся неокупаемым до всякого замера. Это не осторожность,
    # а отказ от половины дохода в тех часах, где полный тир уже недостижим.
    #
    # Maker Yield History даёт шесть закрытых дней на трёх разных балансах
    # (1000 / 11000 / 20000 USD), и ставка держится в узком коридоре:
    #
    #   17 авг  18.72 DUSD / 22.15 MH = 0.845     14 авг  3.57 / 4.15  = 0.860
    #   13 авг   0.23 /  0.28 = 0.821             12 авг  0.15 / 0.19  = 0.789
    #   11 авг   0.13 /  0.16 = 0.813             10 авг  0.05 / 0.06  = 0.833
    #
    # 0.78 — нижняя граница наблюдений, а не среднее: шлюз обязан ошибаться
    # в сторону отказа. Токен-аллокация (около 70 единиц за Maker Hour) сюда
    # НЕ входит намеренно — платформенный токен не запущен, цены у него нет,
    # и подставить сюда догадку значило бы вернуть ту же неизмеренную величину,
    # ради ухода от которой правка и делается. См. PLAN.md §12.4.
    rewardRateLowerBoundUsdPerMakerHour: 0.78
    # Здесь стояло 22 — модельная оценка, снятая до боевых прогонов
    # в предположении, что заливают ступень целиком. Заливают не ступень:
    # 14 августа Maker Hour обошёлся в 0.21 USD, 18 августа — 5.51 USD убытка
    # на 24.48 Maker Hours, то есть 0.225. Модель промахнулась в сто раз.
    #
    # 0.25 — худшее из двух измерений с запасом вверх. При ставке 0.78 это
    # даёт MinimumTierMultiplier = 0.32, то есть тир 0.5x снова оплачивается,
    # а внесессионный множитель 0.1 по-прежнему отвергается (0.078 < 0.25) —
    # ровно то разделение, ради которого шлюз и существует.
    #
    # ПЕРЕСЧИТЫВАТЬ ПО ОТЧЁТАМ БИРЖИ, А НЕ ПО МОДЕЛИ. Обе величины теперь
    # измеримы: ставка — из Maker Yield History, стоимость — из
    # mm_realized_pnl_usd, делённого на зачтённые часы.
    breakEvenUsdPerMakerHour: 0.25
  quote:
    ladderLayers: 2 # лесенка компенсирует отсутствие amend в API
    # The reward band is only 10 bps wide and ends abruptly, so the width of
    # the ladder comes straight out of the distance budget: at 1.0 the three
    # rungs took 2 of those 10 bps. They buy no risk diversification in return
    # — on 6 August all three went in a single sweep, 51 ms apart. A 0.4 bps
    # step is about 1.7 ticks on gold.
    ladderSpreadBps: 0.4
    minRest: 3200ms # ≥3с, иначе ордер не засчитывается в Maker Points
    requoteCooldown: 250ms
    # Сколько ступень остаётся пустой после того, как её освободила защита.
    #
    # ПУСТАЯ СТУПЕНЬ И ОСВОБОЖДЁННАЯ СТУПЕНЬ — РАЗНЫЕ ВЕЩИ, И ДО 18 АВГУСТА
    # 2026 КОД ИХ НЕ РАЗЛИЧАЛ. У живой ступени есть minRest, у пустой не было
    # ничего: ветка Empty в quotes.planOne заполняла её на ближайшем проходе,
    # не спрашивая, почему она опустела.
    #
    # Что из этого вышло, час 13:00 UTC того дня:
    #
    #   13:30:17.250  Danger снял все три бида — "price approaching"
    #   13:30:19.201  planOne вернул слот 0 — "filling an empty rung"
    #   13:30:19.799  planOne вернул слот 1 — то же
    #   13:30:21.319  planOne вернул слот 2 — то же, все три по 4390.5
    #   13:30:22.486  первое из шести исполнений за 1.8 секунды
    #
    # Защита отработала верно и убежала вовремя. Вернул ордера обратно
    # под удар не риск-контур, а заполнение пустых ступеней, которое о его
    # решении не знало.
    #
    # ТРИ СЕКУНДЫ, А НЕ ПОЛТОРЫ. Возврат случился через 1.95 с после снятия,
    # залив — ещё через 3.3 с. Полутора секунд, принятых у сравнимого
    # оператора на TS, здесь не хватило бы вовсе.
    #
    # Цена запрета мала и посчитана: 1098 защитных снятий за сутки, каждое
    # запирает одну ступень, против шести ступеней на 54000 секунд работы —
    # около 1% времени ступени. Сравнивать с 1.18 Maker Hour, которые один
    # незапертый возврат стоил в тот же день.
    #
    # Ноль возвращает прежнее безусловное заполнение.
    refillLockout: 3s
    # Сколько ступень остаётся пустой после отказа «balance not enough».
    #
    # Величина отдельная от refillLockout выше, потому что причина другая.
    # Запрет выше платит присутствием за безопасность: рынок подошёл к ордеру,
    # и вернуть его туда же нельзя. Здесь платят за бюджет запросов: ордер
    # не встал не потому, что опасно, а потому, что денег на него нет,
    # и повтор через 250 мс получит тот же ответ по той же причине.
    #
    # Замер боевого счёта 28 августа, 13:10-13:15 UTC. Бюджет считается
    # от equity по ИЗМЕРЕННОЙ доле блокировки, и эта доля промахнулась:
    # 2.667% против фактических 2.887%, то есть занято 92% капитала вместо
    # 85%. На третью ступень не хватило, освобождённая ступень немедленно шла
    # на повторное заполнение (Engine.onOrderRejected вызывает evaluate сразу),
    # и цикл держался ровно столько, сколько держалась причина: 550 отказов
    # за пять минут, 1.8 в секунду, 14% всего ордерного трафика окна.
    #
    # Пять секунд: причина живёт до следующего снимка баланса, по которому
    # бюджет пересчитывается. Меньше — повтор упрётся в тот же ответ; больше —
    # ступень простаивает после отказа, который уже неактуален.
    #
    # Отказ post-only этой задержки не получает и получать не должен: он
    # означает, что стакан ушёл, а не что кончились деньги, и правильный
    # ответ на него — выставиться заново немедленно.
    #
    # Ноль возвращает прежний немедленный повтор.
    balanceRejectBackoff: 5s
    # Distance kept from the opposing top of book, in exchange ticks. The
    # crossing check only answers "will the exchange reject this"; an order
    # resting on the touch is accepted and then taken by the first move.
    # On gold two ticks is 0.46 bps, so the clamp binds only when the book has
    # run past a mark that has not caught up — and that quote is refused rather
    # than sent, because its whole geometry rests on a stale price.
    postOnlyBufferTicks: 2
  # Дистанции здесь нет: она вычисляется из спреда и измеренного скачка.
  # Задаётся только готовность рисковать. См. PLAN.md §4.5.
  appetite:
    # Мера риска — максимум окна, то есть уже оценка хвоста. Множитель покрывает
    # только смену режима: при 2.0 бот отказывался котировать BTC днём в будни.
    #
    # Множитель решает не только дистанцию. Он решает ЗАЗОР между тем, где
    # стоит котировка, и тем, где срабатывает аварийный съём:
    #
    #   запас = required - panic
    #         = (halfSpread + m*jump + floorMargin) - (halfSpread + jump)
    #         = (m - 1)*jump + floorMargin
    #
    # halfSpread сокращается целиком. При m = 1.25 запас равен четверти скачка
    # плюс 1.5 bps, то есть заведомо меньше одного скачка: движение
    # характерного размера перекрывает его раньше, чем съём успевает уйти.
    # Замер 28 августа 2026: запас ближней ступени p10 = 1.90, медиана 2.32,
    # и оба дорогих залива того дня родились с запасом 1.65 и 2.06.
    #
    # ОСТАЁТСЯ 1.25 СОЗНАТЕЛЬНО. Поднять множитель до 1.5 значит поднять p10
    # до 2.39 ценой падения котирования с 88% до 79% тактов — при целевом
    # аптайме 80 и жёстком поле 72 это посадка на самый край сетки.
    #
    # Размен решён в пользу присутствия, потому что залив перестал быть
    # дорогим событием: закрытие идёт немедленно, медиана 0.39 с по замеру
    # 25-28 августа, а путь восстановления по позиции больше не шлёт дублей
    # (Engine.outstandingFlatten). Платить за редкое исполнение девятью
    # процентами присутствия при такой стоимости закрытия невыгодно.
    #
    # Что действительно опасно и лечится не здесь — тяжёлое исполнение
    # в тонком стакане: 28 августа в 16:23 закрытие 10 XAU за 0.39 с стоило
    # 3.5 USD проскальзывания при depth_ask_usd, упавшей до нуля. Ответ на это
    # даёт размер (utilizationPct), а не дистанция.
    #
    # Прежнее обоснование, снятое замером: оно опиралось на 10 августа со
    # спредом 4.4-5.1 bps, где при 1.5 требование выходило 10.4 против полосы
    # 9.5 и котирование прекращалось вовсе. Сегодня half_spread медианно 1.64
    # при p90 2.31, и этот довод больше не связывает — но вернётся вместе
    # со спредом.
    jumpMultiple: 1.25
    floorMarginBps: 1.5 # запас когда скачок обманчиво мал (выходные, короткое окно)
    deadBandJumps: 2.0 # шире мёртвая зона → реже перестановки, дольше в стакане
    # Не меньше полуширины лесенки (ladderLayers-1) x ladderSpreadBps / 2,
    # иначе крайние ступени стоят вне мёртвой зоны и переставляются бесконечно.
    # Проверяется при запуске.
    #
    # Raised from 0.5, which was the bare minimum the startup check accepts and
    # left the geometry below the resolution of the instrument.
    #
    # The dead band is measured from the centre of the ladder and applied to
    # every rung, so what the outer rungs actually get is the band minus the
    # half width: 0.5 - 0.4 = 0.1 bps. One price tick on gold is 0.1 USD, which
    # at 4335 is 0.23 bps — the margin was smaller than the smallest price the
    # exchange accepts, so snapping alone could push a rung out of the band it
    # was just placed in. Measured consequence on 10 August: 1044 placements in
    # six hours, three a minute, most of them not surviving the three seconds
    # the programme requires before an order counts at all.
    #
    # At 1.2 the outer rungs get 0.8 bps, about three and a half ticks. The cost
    # is that a rung may sit up to 1.2 bps off the ideal distance instead of
    # 0.6 — roughly 19% of weight against 10% — and that weight is worth having
    # only on orders that live long enough to be scored.
    #
    # Note this value also sets how far the required distance must move before
    # the ladder centre follows it (Engine.stickyTarget). Widening is applied
    # immediately regardless; the stickiness only delays moving back in.
    minDeadBandBps: 1.2
    # Сколько требование обязано продержаться ниже стоящей цели, чтобы лесенка
    # сдвинулась обратно к рынку.
    #
    # Без этого срока порог выше работал не гистерезисом, а храповиком.
    # Расширение принимается немедленно, возврат — только при расхождении
    # не меньше minDeadBandBps, а свежая цель снизу зажата полом minBps плюс
    # половина ширины лесенки (7.0 + 0.4 = 7.4). Значит любой всплеск,
    # отодвинувший цель в диапазон 7.4-8.6, разрешить возврат уже не мог ничем:
    # разницы до пола не хватало, а меньше пола требование не бывает.
    #
    # Замер боевого счёта 22-24 августа: центр простоял на 8.36-8.52 более
    # двадцати часов подряд при требовании по риску около 3.1. Полоса награды
    # кончается на десяти, поэтому лишний базисный пункт — прямой вычет из веса:
    # средний вес ступеней 0.672 вместо 0.816, то есть пятая часть начисления
    # за дистанцию, которую никто не выбирал.
    #
    # Минута, а не меньше: короче — и обычное дрожание требования начнёт
    # двигать лесенку, ради чего мёртвая зона и заведена. Не больше: всплеск
    # продолжает стоить веса всё время, пока отсчёт не истёк.
    #
    # Ноль возвращает прежнее поведение — возврат только по minDeadBandBps.
    targetRelaxAfter: 1m
    # Доля целевой дистанции, ближе которой сторона снимается целиком
    # аварийным путём. Больше значение — раньше отход.
    #
    # The physical threshold alone (half spread plus one jump) sits at 0.4-2.7
    # bps on gold while the quote stands at 7.4, and everything between them was
    # handled by the ordinary path: one command in flight per side, one rung at
    # a time, place-first leaving the approached order in the book for the round
    # trip. A trending market crosses those four basis points over several
    # ticks, and every one of them went to slow reaction — that is how the fills
    # actually arrive, rather than through a single instantaneous jump.
    #
    # Ladder.Danger is free of all of it: it bypasses the requote cooldown, the
    # minimum rest and the round-robin queue, and cancels the side in one batch.
    # Widening where it applies is the most direct lever on the fill rate.
    #
    # 0.5 pulls when the market has eaten half the way to the quote: at a target
    # of 7.4 bps that is 3.7 instead of ~1. Cost is presence — a withdrawn side
    # scores nothing until it returns, and re-entry is bounded by minRest.
    # Поднято с 0.5 по заливу 2 сентября 2026, 11:54. Полторы минуты рынок
    # стоял на месте (max_tick_move 0, оценка скачка сползла к 0.63), лесенка
    # упёрлась в пол 7.0/7.4/7.8 — и затем 7.6 bps за несколько секунд.
    #
    # Порог паники = max(halfSpread + jump, panicFraction x цель). В спокойном
    # рынке первая часть ничтожна (0.75), решает вторая: 0.5 x 7.0 = 3.5 bps.
    # То есть оценка должна была подойти к ордеру на 3.9 bps, прежде чем
    # сторона снималась. Быстрый сигнал показал +1.3 bps в 11:54:21.597 и +3.9
    # только в 11:54:22.667 — а биржа свела сделку в 11:54:22.561. Съём ушёл
    # на 106 мс позже сведения.
    #
    # При 0.75 порог 5.25 bps: хватило бы +1.85 bps по оценке, и по ходу
    # того же движения это 11:54:22.0-22.2, то есть за 350-550 мс до сделки
    # при круге запроса в десятки миллисекунд.
    #
    # Почему это НЕ помогло бы 28 августа и почему тогда не поднимали: там
    # jump был 4-5 bps, и физическая часть порога (halfSpread + jump ≈ 6.4)
    # заведомо перекрывала дробную. Рычаг работает только в спокойном режиме
    # — ровно там, где лесенка стоит на полу и запаса нет.
    #
    # Цена — больше аварийных съёмов, каждый с refillLockout в 3 с. В спокойном
    # режиме они редки; смотреть по счётчику «price approaching».
    panicFraction: 0.75
    # Мёртвая зона для решения «котировать или нет», а не для дистанции.
    #
    # Порог осуществимости был единственным решением в контуре без гистерезиса,
    # и рынок стоял ровно на нём: половина спреда ходит от 0.12 до 3.5 bps
    # внутри часа, и каждый заход хвоста за край полосы снимал всю лесенку.
    # 6 августа в двенадцатом часу это дало 564 съёма при аптайме 99% —
    # ордера жили в среднем 6.4 секунды при программном требовании в три,
    # а на дрожание уходило 13% бюджета запросов.
    #
    # Уходим по обычному порогу и немедленно; возвращаемся, только когда
    # требуемая дистанция не дотягивает до края полосы на эту величину.
    reentryDeadBandBps: 1.0
    # Абсолютный пол. С появлением memoryHalfLife он перестал быть основной
    # защитой от заниженной оценки риска и связывает дистанцию редко; снижать
    # его следует по результатам суточного прогона в будни, а не умозрительно.
    #
    # In practice it is not rare at all — it binds almost always. On gold the
    # requirement computes to roughly 2 bps (half spread ~0.1-2.4, effective
    # jump a few tenths, floor margin 1.5), so the floor is what actually
    # decides where the near rung stands.
    #
    # Raised from 5.5 to 7.0 because 5.5 sat inside the observed tail: the
    # single-tick jump of 6 August was 5.38 bps and swept all three rungs in
    # 51 ms. No pull can defend against that — the danger path needs a tick to
    # see the move, and the move is the tick. Standing outside the tail is the
    # only defence, and it is bought with reward weight: 88% at 7.0 against
    # 112% at 5.5, a fifth of the rate, against removing the dominant fill mode.
    # That is the intended trade — a fill is money, the weight is a rate.
    minBps: 7.0
    maxBps: 9.5 # дальше награда обнуляется
  # Когда стакан слишком тонок, чтобы в нём стоять.
  #
  # ЧИСЛО ИЗМЕРЯЛОСЬ И ВЫБРАСЫВАЛОСЬ. Актор считает нотионал в полосе награды
  # по каждой стороне каждый такт и печатает его в сводке (depth_bid_usd,
  # depth_ask_usd). В решениях он не участвовал нигде: то, что в policy зовётся
  # глубиной, — это дистанция минус половина спреда, к ликвидности отношения
  # не имеющая, а посчитанный из неё Quote.Margin встречался только в логе.
  #
  # ЗАМЕР 1 СЕНТЯБРЯ 2026, 23 залива за сутки. 70% пришли при глубине своей
  # стороны в нижней четверти суточного распределения, а два самых крупных
  # (по 10 XAU) — на первом и третьем перцентиле. Оба по ордерам, ВЫСТАВЛЕННЫМ
  # в уже тонкий стакан: сель 22:00:33 прожил 1.76 секунды. Реагировать там
  # было не на что — ордер родился в рынок, который его сразу забрал.
  #
  # Порог задан долей от собственной недавней медианы, а не суммой в долларах:
  # абсолютное число протухает при первой смене баланса, инструмента или часа
  # суток, отношение к своей же норме переживает всё это.
  #
  # 0.70 ВЫБРАН ПО ДАННЫМ, А НЕ ПО ВКУСУ. Перебор по тому же дню, скользящая
  # медиана на окне 30 минут:
  #
  #   порог   блокирует времени   предотвращает заливов
  #   0.50        3.6% / 4.1%           7 из 23
  #   0.60        5.5% / 7.2%           8 из 23
  #   0.70        9.6% / 10.3%         11 из 23
  #   0.80       16.0% / 15.5%         14 из 23
  #
  # Решает не число заливов, а их вес: при 0.60 первый из двух десятитонных
  # (0.62 от медианы) проходит мимо ворот, при 0.70 не проходит ни один.
  # Оба по 10 XAU — это около 43 000 USD нотионала, то есть примерно 22 USD
  # одних комиссий за эпизод независимо от проскальзывания.
  #
  # Запрет только на РАЗМЕЩЕНИЕ. Уже стоящие ступени живут по обычным правилам:
  # они засчитываются программе, а снимать их по тонкому стакану значило бы
  # платить присутствием за состояние, которое чаще проходит само.
  #
  # Ноль отключает проверку целиком.
  liquidity:
    # Окно, по которому считается норма глубины.
    #
    # Десять минут, а не тридцать. Перебор по 1 сентября 2026 (замер раз в 15 с,
    # зрелость 60% окна):
    #
    #   окно   блокирует времени   ловит крупных заливов (>=0.1 XAU)
    #    2m         6.8%                    5 из 6
    #    5m         8.2%                    5 из 6
    #    8m         8.6%                    6 из 6
    #   10m         8.8%                    6 из 6
    #   30m         9.9%                    6 из 6
    #   60m        10.4%                    6 из 6
    #
    # Все шесть крупных ловятся уже с восьми минут; тридцать стоят лишней
    # десятой процента присутствия за тот же результат. Короче восьми окно
    # начинает пропускать: норма сползает вслед за уходящей глубиной и
    # перестаёт замечать сам уход.
    window: 10m
    # Минимальный промежуток между замерами.
    #
    # БЕЗ НЕГО ОКНО МЕРЯЕТ СОБЫТИЯ, А НЕ ВРЕМЯ. Такт актора идёт по приходу
    # рыночных данных — 1 сентября это 3.4 обновления стакана в секунду плюс
    # mark и события ордеров. В окне копились бы тысячи замеров, minSamples
    # набирался бы за секунды вместо минут, а медиана считалась бы по всему
    # этому на каждом такте. И главное: частота событий сама зависит от рынка,
    # поэтому оживлённые отрезки перевешивали бы норму — ровно тогда, когда
    # она нужнее всего.
    sampleEvery: 1s
    # Зрелость в ЗАМЕРАХ. Вместе с sampleEvery это пять минут данных.
    # До зрелости сторона считается пригодной: молчать из-за отсутствия
    # данных значит платить присутствием ни за что.
    minSamples: 300
    thinFraction: 0.70
    # ДВА ПОРОГА И ВЫДЕРЖКА, А НЕ ОДИН ГОЛЫЙ.
    #
    # Первая версия сравнивала глубину с одной долей медианы и дёргала сторону
    # при каждом пересечении. Замер 2 сентября 2026 за полдня: 515 эпизодов
    # «тонко», медиана длительности ОДНА секунда, 90% короче пяти, 379 съёмов
    # стороны. Глубина дрожит вокруг порога, и каждый круг «снял-вернул» — это
    # четыре запроса и дыра в присутствии.
    #
    # Тот же замер: настоящие обвалы ни с чем не спутать — аск 90 499 USD при
    # норме 7M (1.3%), 528 000 при 6M (9%). Доля ниже 0.35 встречается в 2.2%
    # тактов, и на неё сторона закрывается НЕМЕДЛЕННО: упреждение в сотни
    # миллисекунд, ради которого фильтр заведён, здесь сохраняется.
    severeFraction: 0.35
    # Мягкая просадка до 0.70 закрывает сторону, только продержавшись три
    # секунды: 90% таких эпизодов короче пяти — это шум, а не событие.
    thinAfter: 3s
    # Возврат выше и дольше, как и везде в этом контуре. Пауза между эпизодами
    # дребезга имела нижнюю четверть в 5 с — выдержка в 10 с их склеивает.
    recoverFraction: 0.85
    recoverAfter: 10s
    # Снимать ли уже стоящие ступени, а не только запрещать новые.
    #
    # ЗАМЕР 2 СЕНТЯБРЯ 2026, первый час после выката ворот:
    #
    #   09:05:19.441  выставлен sell 4326.3
    #   09:05:59.668  ворота: глубина аска 2.84M против порога 4.90M
    #   09:06:00.073  биржа свела ЭТОТ ЖЕ ордер
    #   09:06:11      jump вырос с 0.98 до 6.74
    #
    # Вердикт опередил исполнение на 405 мс, а обвал глубины опередил само
    # движение на десяток секунд. Круг запроса на снятие — десятки
    # миллисекунд, то есть запаса хватало с избытком. Не хватило права
    # снимать: ордер стоял с 09:05:19 и под запрет на размещение не подпадал.
    #
    # Ложь оставляет прежнее поведение — только запрет на новые ордера.
    pullOnThin: true

  volatility:
    # Окно больше не задаёт длительность осторожности — с 19 августа это делает
    # windowHalfLife ниже. Окно осталось горизонтом выборки: по нему считаются
    # перцентили, наблюдаемый jump_window и зрелость оценки.
    #
    # Сокращено с 20m. Измерено 10-11 августа: тик 7.55 bps встал в окне и
    # держал требуемую дистанцию выше всей полосы награды двадцать минут,
    # после чего эстафету приняла ограниченная память — итого сорок минут
    # простоя на рынке, который успокоился через пять. При тиерном зачёте
    # семнадцать минут отсутствия в начале часа списывают час целиком, так
    # что двадцатиминутное окно означало гарантированную потерю часа на каждом
    # крупном тике. За ночь так списались три часа из семи.
    #
    # Восемь минут при такте около трёх секунд — это 160 замеров, вдвое больше
    # зрелости оценки (fullConfidenceAt), так что точность не страдает.
    window: 8m
    minSamples: 40 # 2 минуты прогрева до первой котировки
    fullConfidenceAt: 100 # 5 минут до зрелой оценки
    # Полураспад меры риска — сколько на самом деле длится осторожность после
    # всплеска. До 19 августа этой величины не было: мера равнялась сырому
    # максимуму окна, то есть держалась на полке всё окно и обрывалась разом.
    #
    # Замер боевого счёта 19 августа при этом же window: 8m: 52% полок
    # держались дольше пяти минут, и почти все длинные — одно и то же число
    # без изменений, то есть один тик, а не серия. Рынок остывал за минуты,
    # мера об этом не узнавала до края окна.
    #
    # Четыре минуты выбраны по этому же замеру. На пятой минуте — там, где
    # измерена проблема — от всплеска остаётся 2^(-5/4) = 42%, то есть
    # послабление ровно в 2.4 раза; к восьмой минуте, бывшему краю окна, 25%.
    # Настоящую серию это не отпускает: повторный сопоставимый скачок взводит
    # рекорд заново, и величина реакции на сам скачок не меняется — меняется
    # только скорость выхода из неё.
    #
    # Обязан быть строго меньше window, иначе рекорд отпускает медленнее,
    # чем отпускало бы сырое окно, и смысл замены теряется (validate.go).
    windowHalfLife: 4m
    # A floor on the risk measure that outlives the window: without it a frozen
    # market yields a mature estimate of a near-zero jump, and the actor walks
    # in just before the market wakes up.
    #
    # NOT justified by the weekend any more — that case is handled directly by
    # program.offHours, see PLAN.md section 12.14. What justifies it is that the
    # fast record fades in minutes, while volatility clusters over hours: the
    # fill of 6 August was hours of quiet, then 5.38 bps in one tick.
    #
    # Six hours is also what kept the actor out of the book for hours at a
    # stretch that same day. The trade is settled by arithmetic once the price
    # of a Maker Hour and the fill rate are measured, not before.
    memoryHalfLife: 6h
    # Верхняя граница долгой памяти: она не вправе требовать больше, чем эта
    # доля от быстрого рекорда (fast). До 19 августа отсчитывалась от сырого
    # максимума окна — то есть от плоской полки, которую замена и убирала;
    # оставить границу на ней значило впустить полку обратно через эту дверь.
    #
    # Затухающий максимум не возвращается к среднему — понизить его не может
    # ни одно последующее наблюдение, только часы. 7 августа всплеск длиной
    # в минуту выключил бота на 8.4 часа, тогда как окно уже полчаса как
    # показывало десятую долю этой величины. Ограничение даёт то же свойство,
    # ради которого в EWMA и GARCH затухание считают по наблюдениям: рекорд
    # сходится к тому, что рынок показывает сейчас, а не к нулю по расписанию.
    #
    # Пока всплеск свеж, fast равен ему целиком, и ограничение не действует —
    # защита полная. Ноль отключает его и возвращает безусловную память.
    #
    # Единица не отключает память, а запрещает ей требовать больше текущего
    # fast. Разница существенная: при незрелой оценке и при fast ровно в нуле
    # ограничение не применяется вовсе (Estimator.bounded), и память действует
    # безусловно — то есть ровно в тех двух случаях, ради которых она написана.
    #
    # Снижено с 3 по замеру 11 августа: живое окно показывало 2.97 bps, память
    # 7.32, ограничение 2x давало 5.95 и требование 9.73 при полосе 8.50 —
    # отказ котировать на спокойном рынке. С единицей мера равна 2.97,
    # требование 6.0, то есть упирается в пол minBps и котирует с запасом.
    # Держала не волатильность, а воспоминание о тике, из окна уже вышедшем.
    memoryWindowMultiple: 1
  uptime:
    targetPct: 80 # выше 70% зачёт не растёт, разница — страховой запас
    hardFloorPct: 72
    reservePct: 8
  risk:
    # Leverage of the account, applied on the exchange at start-up and verified
    # by reading it back (account.ApplyLeverage). The same field inside an order
    # is ignored by the venue — five probes at 4x, 8x and 20x all locked the
    # identical share of notional (PLAN.md §12.5).
    #
    # Forty because that is what the account allows and what a comparable
    # operator runs. Our effective leverage was 9.49, the venue default, purely
    # because this call did not exist: a dollar of margin carried nine dollars
    # of notional instead of forty.
    leverage: 40
    # Share of an order's notional the exchange locks. This is what sizing
    # divides by; the leverage above only reaches it through the account
    # setting, never through the order.
    #
    # 10.542% was measured at an effective leverage of 9.49 and is deliberately
    # kept until the probe is repeated at forty. Overstating it costs size,
    # which is recoverable; understating it inflates the size, and after a fill
    # the closing order can fail for want of free margin.
    #
    #   STANDX_LIVE=1 STANDX_SMOKE_SYMBOL=XAU-USD \
    #     go test -v -tags=live -run TestMarginFormula -count=1 ./test/live/
    initialMarginPct: 10.542
    maxNetPositionBase: "0" # 0 — закрывать любую позицию немедленно
  # External venue whose price leads the exchange mark. Off by default and
  # named per instrument: a symbol that tracks a different underlying is worse
  # than no feed, because a wrong signal is still acted upon.
  #
  # Its drift since the last mark tick feeds the danger thresholds, replacing
  # the drift of the exchange's own book mid (PLAN.md §4.7). The book mid moves
  # with the very order that fills us, so its warning has zero length; the
  # external venue shows the same move earlier.
  #
  # The feed is advisory. Losing it, or letting it go stale, returns the bot to
  # the picture it had before and never stops quoting on its own.
  reference:
    enabled: false
    provider: binance_futures # binance_futures | binance_spot | bybit_linear | bybit_spot
    symbol: ""
    # One mark tick. Silence on a book-ticker stream means the top of book did
    # not change — information, not the absence of it — so the threshold exists
    # to catch a socket that died quietly, not a calm market. Past one tick the
    # official price supersedes the estimate anyway. At two seconds this warned
    # about a perfectly healthy gold feed once every two minutes.
    staleAfter: 3s

# Параметры начисления публикуются StandX и меняются оперативной командой:
# https://docs.standx.com/docs/standx-perps-solutions/community-maker-yield
symbols:
  # Золото — рабочий инструмент. Выбрано по измерениям 3–5 августа:
  # глубина стакана внутри полосы p05 = 1.9M USD (у остальных, кроме BTC,
  # около нуля), самый тонкий хвост и спреда, и скачка, окупаемость
  # с 31 USD за Maker Hour. См. docs/ab-appetite-2026-08-05.md.
  XAU-USD:
    enabled: true
    program:
      unitSize: "30"
      perSideCap: "60"
      maxMakerHoursPerHour: 2
      # The reference market is shut over the weekend: the exchange scales
      # the hour's accrual by 0.1 while the fill risk is unchanged, so the
      # break-even price of a Maker Hour rises tenfold.
      #
      # Narrowed 15 August to the venue's published session, as the comment that
      # stood here instructed once accrual had been reconciled. StandX states it
      # as "Sunday to Friday, 18:00 to 17:00 next day" in US Eastern; August is
      # UTC-4, so the session runs Sun 22:00 UTC to Fri 21:00 UTC. The previous
      # window gave away an hour every Friday and two every Sunday — three hours
      # a week of full-rate session, about 1.9 Maker Hours at the rate measured
      # on 14 August.
      #
      # Times are UTC and evaluated as UTC whatever the host clock says
      # (reward.weekMinuteOf converts explicitly); the server runs Etc/UTC.
      #
      # NOT COVERED HERE: the venue also halts daily from 17:00 to 18:00 ET,
      # that is 21:00-22:00 UTC, Monday through Thursday. reward.Schedule holds
      # one weekly window and cannot express it, so for four hours a week the
      # bot still quotes at full fill risk while the hour accrues at a tenth.
      # Closing that needs a code change, not a value here.
      offHoursMultiplier: 0.1
      offHours:
        from: "Fri 21:00"
        to: "Sun 22:00"
        # The exchange publishes no machine-readable holiday calendar, so this
        # list is maintained by hand. Empty is not a claim that there are none.
        holidays: []
      # true — торговать в выходные, false — стоять в стороне.
      # Экономический шлюз следует этому же ключу: при true час оценивается
      # по полной ставке, иначе он отверг бы выходные вторым отказом.
      quoteOffHours: true
    # Binance USD-M XAUUSDT, a TradFi-tracking perpetual: 1.26 bn USD of quote
    # volume and 875k trades a day at a 0.02 bps spread, measured 10 August.
    # An order of magnitude past Bybit's book on the same underlying, and the
    # only venue where gold moves before the exchange mark shows it.
    #
    # Выключен: не измерено, сколько упреждения фид даёт на самом деле
    # (PLAN.md §12.15). Пока бот работает на прежнем быстром сигнале — смещении
    # середины стакана. Площадка и символ описаны заранее, чтобы включение
    # стоило одной строки, а не подбора имени инструмента в бою.
    reference:
      enabled: true
      provider: binance_futures
      symbol: XAUUSDT

  # Единственная реальная альтернатива: стакан глубже золотого, но полоса
  # награды съедена волатильностью — проигрывает при любом $/MH.
  BTC-USD:
    enabled: false
    program: { unitSize: "2", perSideCap: "20", maxMakerHoursPerHour: 10 }
    reference: { enabled: true, provider: binance_futures, symbol: BTCUSDT }

  ETH-USD:
    enabled: false
    program: { unitSize: "60", perSideCap: "600", maxMakerHoursPerHour: 10 }
    reference: { enabled: true, provider: binance_futures, symbol: ETHUSDT }
  SOL-USD:
    enabled: false
    program: { unitSize: "1500", perSideCap: "15000", maxMakerHoursPerHour: 10 }
    reference: { enabled: true, provider: binance_futures, symbol: SOLUSDT }
  BNB-USD:
    enabled: false
    program: { unitSize: "300", perSideCap: "3000", maxMakerHoursPerHour: 10 }
    reference: { enabled: true, provider: binance_futures, symbol: BNBUSDT }
  HYPE-USD:
    enabled: false
    program: { unitSize: "4000", perSideCap: "40000", maxMakerHoursPerHour: 10 }
    reference: { enabled: true, provider: binance_futures, symbol: HYPEUSDT }

  # Металлы: спред шире, движение рваное — см. PLAN.md §1.4.
  XAG-USD:
    enabled: false
    program:
      unitSize: "1500"
      perSideCap: "3000"
      maxMakerHoursPerHour: 2
      # The reference market is shut over the weekend: the exchange scales
      # the hour's accrual by 0.1 while the fill risk is unchanged, so the
      # break-even price of a Maker Hour rises tenfold. The window is
      # deliberately wider than the venue's real hours (COMEX closes Fri
      # 21:00 UTC and reopens Sun 22:00): erring towards "closed" costs idle
      # time, erring the other way costs money. Narrow it once the first
      # actual accrual has been reconciled.
      offHoursMultiplier: 0.1
      offHours:
        from: "Fri 21:00"
        to: "Sun 22:00"
        # The exchange publishes no machine-readable holiday calendar, so this
        # list is maintained by hand. Empty is not a claim that there are none.
        holidays: []
    reference: { enabled: true, provider: binance_futures, symbol: XAGUSDT }
  CL-USD:
    enabled: false
    program:
      unitSize: "1400"
      perSideCap: "2800"
      maxMakerHoursPerHour: 2
      # The reference market is shut over the weekend: the exchange scales
      # the hour's accrual by 0.1 while the fill risk is unchanged, so the
      # break-even price of a Maker Hour rises tenfold. The window is
      # deliberately wider than the venue's real hours (COMEX closes Fri
      # 21:00 UTC and reopens Sun 22:00): erring towards "closed" costs idle
      # time, erring the other way costs money. Narrow it once the first
      # actual accrual has been reconciled.
      offHoursMultiplier: 0.1
      offHours:
        from: "Fri 21:00"
        to: "Sun 22:00"
        # The exchange publishes no machine-readable holiday calendar, so this
        # list is maintained by hand. Empty is not a claim that there are none.
        holidays: []

  # Oil and the equities are left without a reference on purpose. A venue that
  # lists the ticker is not the same thing as a venue where it leads, and an
  # unverified mapping is worse than none: a wrong signal is still acted upon.
  # Fill one in only after checking the venue's own turnover on that symbol,
  # the way XAUUSDT was checked above.

  # Акции: гэпы на открытии и закрытии базового рынка.
  TSLA-USD:
    enabled: false
    program:
      unitSize: "400"
      perSideCap: "800"
      maxMakerHoursPerHour: 2
      # The reference market is shut over the weekend: the exchange scales
      # the hour's accrual by 0.1 while the fill risk is unchanged, so the
      # break-even price of a Maker Hour rises tenfold. The window is
      # deliberately wider than the venue's real hours (COMEX closes Fri
      # 21:00 UTC and reopens Sun 22:00): erring towards "closed" costs idle
      # time, erring the other way costs money. Narrow it once the first
      # actual accrual has been reconciled.
      offHoursMultiplier: 0.1
      # ВНИМАНИЕ: окно ниже описывает сессию металлов, а не биржевых акций.
      # StandX объявляет для этого инструмента "US equity session" — 09:30-16:00
      # ET, то есть 13:30-20:00 UTC по будням. Недельное окно такого не
