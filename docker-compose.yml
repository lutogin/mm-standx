services:
  mmbot:
    image: lutogin/mm-standx:latest
    container_name: mmbot
    restart: unless-stopped

    env_file: [.env]
    environment:
      MMSTANDX_RUNTIME_MODE: ${MM_MODE:-dry_run}
      MMSTANDX_RUNTIME_SYMBOLS: ${MM_SYMBOLS:-XAU-USD}
      MMSTANDX_RUNTIME_METRICSADDR: ":9090"

    volumes:
      - ./data:/app/data

    ports:
      - "127.0.0.1:${MM_METRICS_PORT:-9090}:9090"

    stop_grace_period: 60s

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9090/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"
