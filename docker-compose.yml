# Один контейнер: торгующий процесс.
#
# Сторожа (cmd/guardian) здесь нет намеренно. Он умеет обнаруживать только
# смерть процесса, а это Docker закрывает сам: restart поднимает контейнер
# за секунды, и сверка при старте снимает осиротевшие ордера. Зависший актор
# при живом процессе сторож не заметит — файл биения пишет отдельная горутина,
# не связанная с торговым циклом.
#
# Вне Docker сторож нужен: там процесс никто не поднимает.
#
# Сборка идёт на машине разработки, на сервер приезжает готовый образ.
# Исходников и конфигурации на сервере нет и не нужно: config.yaml внутри
# образа, а всё, что различается между машинами, задано в .env.
#
#   на локальной машине:   make image && make push
#   на сервере:            mkdir -p data && chown 10001:10001 data
#                          docker compose pull && docker compose up -d
#   наблюдение:            docker compose logs -f mmbot
#   остановка:             docker compose down

services:
  mmbot:
    # Только образ, без build: на сервере нет ни исходников, ни Dockerfile.
    # Сборка и публикация — на машине разработки, см. `make image`, `make push`.
    image: lutogin/mm-standx:latest
    container_name: mmbot
    restart: unless-stopped

    env_file: [.env]
    environment:
      # Режим и инструменты задаются здесь, а не в config.yaml: один файл
      # конфигурации едет на все машины, решение принимается при запуске.
      MMSTANDX_RUNTIME_MODE: ${MM_MODE:-dry_run}
      MMSTANDX_RUNTIME_SYMBOLS: ${MM_SYMBOLS:-XAU-USD}
      # Метрики слушают все интерфейсы внутри сети контейнера; наружу порт
      # публикуется только на петлю, см. ports ниже.
      MMSTANDX_RUNTIME_METRICSADDR: ":9090"

    volumes:
      # Каталог рядом с compose, а не именованный том: почасовую свёртку
      # забирают обычным scp, а из тома её пришлось бы доставать через
      # docker cp. Внутри — сохранённая сессия, снимок защитного контура
      # и статистика.
      #
      # Каталог обязан существовать и принадлежать пользователю контейнера,
      # иначе процесс не сможет в него писать и упадёт на старте:
      #
      #   mkdir -p data && chown 10001:10001 data
      #
      # config.yaml здесь не монтируется: он внутри образа. Монтировать
      # одиночный файл нельзя — при его отсутствии Docker создаёт на его
      # месте каталог, и процесс падает на «is a directory».
      - ./data:/app/data

    # Порт только на петлю: наружу метрики отдавать незачем, снимаются они
    # через ssh-туннель.
    ports:
      # Порт наружу настраивается: 9090 занят на удивление часто.
      - "127.0.0.1:${MM_METRICS_PORT:-9090}:9090"

    # Завершение не мгновенное по замыслу: актор снимает котировки, трижды
    # перечитывает список ордеров у биржи, убеждаясь что стакан пуст, и при
    # необходимости закрывает позицию. Стандартных десяти секунд на это мало,
    # а убитый на середине процесс оставит ордера в рынке.
    stop_grace_period: 60s

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9090/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

