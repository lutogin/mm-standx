services:
  mmbot:
    # Образ закреплён на коммит, а не на подвижный тег.
    #
    # ПОЧЕМУ НЕ ПРОСТО latest. Сам по себе он работал: деплой делает
    # `compose pull`, тот идёт в реестр, и `up -d` пересоздаёт контейнер,
    # когда идентификатор образа сменился. Ломается не механика, а
    # возможность спросить.
    #
    # 18 августа 2026 на сервере лежал ровно один тег — latest, — и на вопрос
    # «какой коммит сейчас торгует» ответом было «dfb497cd, 34 часа назад».
    # Тем же вечером выяснилось, что правка конфигурации не подействовала,
    # потому что процесс подняли сутками раньше: обнаружить это было нечем,
    # и стоило это суток работы на старом коде. Подвижный тег — та же ловушка
    # в её второй половине.
    #
    # Второе: путь отката раньше делал `docker tag <старый> latest`, то есть
    # локальный latest начинал расходиться с реестром. Теперь откат
    # переключает MM_IMAGE_TAG на отдельный тег rollback и latest не трогает.
    #
    # Значение подставляет деплой (MM_IMAGE_TAG=sha-<commit>). Умолчание
    # оставлено latest, чтобы `docker compose up -d` руками на сервере
    # продолжал работать: после успешного деплоя pull уже привёл локальный
    # latest к тому же образу, а после отката — к откаченному, так что
    # в обоих случаях умолчание совпадает с тем, что и так работает.
    #
    # Что сейчас запущено:
    #   docker inspect mmbot --format '{{.Config.Image}}'
    #   docker inspect mmbot --format \
    #     '{{index .Config.Labels "org.opencontainers.image.revision"}}'
    image: lutogin/mm-standx:${MM_IMAGE_TAG:-latest}
    container_name: mmbot
    restart: unless-stopped

    # Окружением приходят ровно две вещи: приватный ключ и MM_MODE. Всё
    # остальное описано в config/config.yaml — инструменты, пределы риска,
    # адрес метрик. Второго места, где это можно задать, больше нет.
    env_file: [.env]

    volumes:
      # Конфигурация подключается каталогом, а не файлом, и только на чтение.
      #
      # Каталогом — потому что одиночный файл Docker привязывает по иноду:
      # правка через vim или sed -i создаёт новый инод, и контейнер продолжает
      # видеть старое содержимое, ничего об этом не сообщая.
      #
      # Правка применяется перезапуском контейнера, без пересборки образа:
      #   docker compose restart mmbot
      - ./config:/app/config:ro
      # Состояние: сохранённая сессия, снимок защитного контура, почасовая
      # свёртка показателей. Каталог общий со сторожем — через него передаётся
      # файл биения.
      - ./data:/app/data
      # The process log, kept on the host so that reading it needs neither root
      # nor a container id, and so that recreating the container does not take
      # the history of the run that made it necessary. The process bounds these
      # files itself (runtime.logMaxSizeMb × logMaxFiles); the json-file driver
      # below bounds the stdout copy separately.
      #
      # Like data/, this directory must belong to the container user:
      #   mkdir -p logs && chown 10001:10001 logs
      - ./logs:/app/logs

    # Порт только на петлю: наружу метрики отдавать незачем, снимаются они
    # через ssh-туннель.
    ports:
      - "127.0.0.1:9090:9090"

    # Завершение не мгновенное по замыслу: актор снимает котировки, трижды
    # перечитывает список ордеров у биржи, убеждаясь что стакан пуст, и при
    # необходимости закрывает позицию. Стандартных десяти секунд на это мало,
    # а убитый на середине процесс оставит ордера в рынке.
    stop_grace_period: 60s

    # Проба теперь отвечает за торговлю, а не только за живой сокет: замерший
    # актор возвращает 503, и контейнер уходит в unhealthy. Сторожа в Docker
    # нет, поэтому иначе зависание торговли не увидел бы никто — 13 августа
    # так и вышло, healthy тридцать пять минут при мёртвом акторе.
    #
    # start_period с запасом: на старте бот читает спецификации инструментов
    # с биржи (таймаут 30 с), и до первого такта актора проба обязана молчать,
    # иначе медленный старт превращается в цикл перезапусков.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9090/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"
