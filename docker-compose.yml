services:
  mmbot:
    image: lutogin/mm-standx:latest
    container_name: mmbot
    restart: unless-stopped

    env_file: [.env]
    environment:
      # Режим и инструменты задаются здесь, а не в config.yaml: один файл
      # конфигурации едет на все машины, решение принимается при запуске.
      MMSTANDX_RUNTIME_MODE: ${MM_MODE:-dry_run}
      MMSTANDX_RUNTIME_SYMBOLS: ${MM_SYMBOLS:-XAU-USD}
      # Метрики слушают все интерфейсы внутри сети контейнера; наружу порт
      # публикуется только на петлю, см. ports ниже.
      MMSTANDX_RUNTIME_METRICSADDR: ":9090"

    volumes:
      # - ./config.yaml:/app/config.yaml:ro
      # Состояние: сохранённая сессия, снимок защитного контура, почасовая
      # свёртка показателей. Каталог общий со сторожем — через него передаётся
      # файл биения.
      - ./data:/app/data

    # Порт только на петлю: наружу метрики отдавать незачем, снимаются они
    # через ssh-туннель.
    ports:
      - "127.0.0.1:9090:9090"

    # Завершение не мгновенное по замыслу: актор снимает котировки, трижды
    # перечитывает список ордеров у биржи, убеждаясь что стакан пуст, и при
    # необходимости закрывает позицию. Стандартных десяти секунд на это мало,
    # а убитый на середине процесс оставит ордера в рынке.
    stop_grace_period: 60s

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9090/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"
