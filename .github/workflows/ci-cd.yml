name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Test and build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          files="$(gofmt -l .)"
          if [[ -n "$files" ]]; then
            printf 'Go files are not formatted:\n%s\n' "$files"
            exit 1
          fi

      - name: Download modules
        run: go mod download

      - name: Run vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

      - name: Build binaries
        run: make build

  container:
    name: Build container
    runs-on: ubuntu-24.04
    needs: ci
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: lutogin/mm-standx:ci
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish to Docker Hub
    runs-on: ubuntu-24.04
    needs: [ci, container]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            lutogin/mm-standx:latest
            lutogin/mm-standx:sha-${{ github.sha }}
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Vultr
    runs-on: ubuntu-24.04
    needs: publish
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      # Recreating the container resets the scoring hour: every grid slot before
      # the process started is counted as zero, deliberately, so that a restart
      # cannot manufacture uptime the exchange never saw. Past roughly minute 15
      # the hour can no longer reach the qualifying tier, so the actor withdraws
      # until the next one — a deploy at minute 30 costs the whole remainder.
      # Measured 10 August: four restarts, three of them mid-hour, three hours
      # written off. The push lands at an arbitrary minute; the deploy should
      # not.
      #
      # Put an escape hatch in the commit message when the fix cannot wait.
      # - name: Wait for the UTC hour boundary
      #   if: ${{ !contains(github.event.head_commit.message, '[deploy-now]') }}
      #   shell: bash
      #   run: |
      #     set -euo pipefail
      #     minute=$(date -u +%-M)
      #     if (( minute < 15 )); then
      #       echo "minute $minute: the hour is still reachable, deploying now"
      #       exit 0
      #     fi
      #     seconds=$(( (60 - minute) * 60 - $(date -u +%-S) ))
      #     echo "minute $minute: waiting ${seconds}s so the deploy lands on the hour"
      #     sleep "$seconds"

      - name: Configure SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          ssh-keyscan -H "$VPS_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          eval "$(ssh-agent -s)"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" | ssh-add -
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      - name: Log in to Docker Hub on VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$DOCKERHUB_TOKEN" | ssh \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "root@${VPS_HOST}" \
            "docker login --username '$DOCKERHUB_USERNAME' --password-stdin"

      # Конфигурация больше не запечена в образ и едет отдельно.
      #
      # Кладётся в промежуточный каталог, а не поверх работающего: обрыв ssh
      # на середине копирования иначе оставил бы полуфайл, по которому бот
      # поднимется при следующем же перезапуске. Подмена — на той стороне,
      # одним mv, вместе со снимком предыдущей версии для отката.
      #
      # docker-compose.yml едет тем же рейсом: он описывает, каким томом эта
      # конфигурация подключается, и разъехаться с ней не может.
      - name: Upload configuration
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "root@${VPS_HOST}" \
            'rm -rf /root/opt/mm-standx/config.incoming'
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -r \
            ./config "root@${VPS_HOST}:/root/opt/mm-standx/config.incoming"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            ./docker-compose.yml "root@${VPS_HOST}:/root/opt/mm-standx/docker-compose.yml"

      - name: Deploy
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "root@${VPS_HOST}" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail

          root=/root/opt/mm-standx

          test -f "$root/docker-compose.yml" || {
            echo "missing $root/docker-compose.yml" >&2
            exit 1
          }
          # Ключ кошелька остаётся единственным, что живёт на сервере руками.
          test -f "$root/.env" || {
            echo "missing $root/.env" >&2
            exit 1
          }
          test -f "$root/config.incoming/config.yaml" || {
            echo "missing $root/config.incoming/config.yaml: upload did not land" >&2
            exit 1
          }

          # Снимок действующей конфигурации снимается до подмены: откат на
          # предыдущий образ со сломавшей старт конфигурацией не откат.
          rm -rf "$root/config.previous"
          if [[ -d "$root/config" ]]; then
            cp -a "$root/config" "$root/config.previous"
          fi
          rm -rf "$root/config"
          mv "$root/config.incoming" "$root/config"

          previous_image="$(docker image inspect lutogin/mm-standx:latest \
            --format '{{.Id}}' 2>/dev/null || true)"

          docker compose --project-directory "$root" pull mmbot
          docker compose --project-directory "$root" \
            up -d --remove-orphans mmbot

          for _ in $(seq 1 60); do
            status="$(docker inspect --format '{{.State.Health.Status}}' mmbot \
              2>/dev/null || true)"
            if [[ "$status" == "healthy" ]]; then
              exit 0
            fi
            if [[ "$status" == "unhealthy" ]]; then
              break
            fi
            sleep 2
          done

          docker compose --project-directory "$root" \
            logs --no-color --tail=100 mmbot >&2 || true

          # Откатывается пара целиком — образ и конфигурация. Порознь они
          # не совпадают: сломать старт способна любая из двух половин, и
          # старый бинарь с новым файлом — такое же несочетание, как наоборот.
          if [[ -d "$root/config.previous" ]]; then
            rm -rf "$root/config"
            mv "$root/config.previous" "$root/config"
            echo "configuration rolled back to the previous version" >&2
          fi

          if [[ -n "$previous_image" ]]; then
            docker tag "$previous_image" lutogin/mm-standx:latest
            docker compose --project-directory "$root" \
              up -d --force-recreate mmbot
          fi

          exit 1
          REMOTE
