name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Test and build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Одно определение проверки на CI и на машину разработчика.
      #
      # Раньше здесь стоял свой gofmt, а в Makefile — `go fmt ./...`, который
      # обходит пакеты и видит не то же самое. Локально проект выглядел чистым
      # при красном конвейере, и «почини формат» превращалось в отдельный
      # коммит после каждого push.
      #
      # Причина устраняется хуком (`make hooks`), а этот шаг остаётся
      # страховкой: хук живёт на машине разработчика, его можно не поставить
      # и можно обойти через --no-verify.
      - name: Check formatting
        run: make fmt-check

      - name: Download modules
        run: go mod download

      - name: Run vet
        run: go vet ./...

      # Детектор гонок обязателен, а не желателен. Признак жизни, ячейки
      # быстрых потоков и счётчик потерь — общее состояние между горутиной
      # актора и горутинами публикующих; ошибка здесь не воспроизводится
      # на прогоне без -race и проявляется только в бою. Одна такая уже была:
      # enqueue писал e.halted с чужой горутины.
      - name: Run tests
        run: make test

      - name: Build binaries
        run: make build

  container:
    name: Build container
    runs-on: ubuntu-24.04
    needs: ci
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: lutogin/mm-standx:ci
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish to Docker Hub
    runs-on: ubuntu-24.04
    needs: [ci, container]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            lutogin/mm-standx:latest
            lutogin/mm-standx:sha-${{ github.sha }}
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Vultr
    runs-on: ubuntu-24.04
    needs: publish
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      # Деплою нужны исходники: конфигурация больше не едет внутри образа,
      # и её берут из рабочего каталога, а не из выкачанного тега.
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          ssh-keyscan -H "$VPS_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          eval "$(ssh-agent -s)"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" | ssh-add -
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      - name: Log in to Docker Hub on VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$DOCKERHUB_TOKEN" | ssh \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "root@${VPS_HOST}" \
            "docker login --username '$DOCKERHUB_USERNAME' --password-stdin"

      # Конфигурация больше не запечена в образ и едет отдельно.
      #
      # Кладётся в промежуточный каталог, а не поверх работающего: обрыв ssh
      # на середине копирования иначе оставил бы полуфайл, по которому бот
      # поднимется при следующем же перезапуске. Подмена — на той стороне,
      # одним mv, вместе со снимком предыдущей версии для отката.
      #
      # docker-compose.yml едет тем же рейсом: он описывает, каким томом эта
      # конфигурация подключается, и разъехаться с ней не может.
      - name: Upload configuration
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "root@${VPS_HOST}" \
            'rm -rf /root/opt/mm-standx/config.incoming'
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -r \
            ./config "root@${VPS_HOST}:/root/opt/mm-standx/config.incoming"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            ./docker-compose.yml "root@${VPS_HOST}:/root/opt/mm-standx/docker-compose.yml"

      # Пересоздание контейнера обнуляет учётный час: все слоты сетки до старта
      # процесса считаются нулями — намеренно, чтобы рестарт не изобретал
      # аптайм, которого биржа не видела. Достижимый максимум после рестарта
      # на минуте M равен (60-M)/60, и отсюда весь расчёт:
      #
      #   до 15   ->  >=75%  ->  полный тир, 2.00 Maker Hour
      #   15..30  ->  50-75% ->  половинный тир, около 1.00
      #   после 30->  <50%   ->  час потерян целиком
      #
      # Замер 10 августа: четыре рестарта, три из них в середине часа, трое
      # суток... точнее три часа списано. Push приходит на произвольной минуте,
      # деплой не обязан.
      #
      # ШАГ СТОЯЛ ЗАКОММЕНТИРОВАННЫМ И СТОЯЛ НЕ ЗДЕСЬ. Он был первым в задаче,
      # то есть спал до границы часа, а ПОТОМ шли checkout, настройка ssh,
      # копирование конфигурации и pull образа — несколько минут, на которые
      # перезапуск съезжал за границу. Ожидание обязано быть последним, что
      # происходит перед сменой контейнера, иначе оно отмеряет не то событие.
      #
      # Порог оставлен на 15, хотя после починки экономического шлюза
      # половинный тир снова оплачивается и промах до 30-й минуты больше
      # не обнуляет час. Менять 15 на 30 значит менять гарантированный полный
      # тир на половинный — обмен невыгодный; смягчение здесь работает
      # страховкой, а не разрешением.
      #
      # Аварийный выход — [deploy-now] в сообщении коммита.
      - name: Wait for the UTC hour boundary
        if: ${{ !contains(github.event.head_commit.message, '[deploy-now]') }}
        shell: bash
        run: |
          set -euo pipefail
          minute=$(date -u +%-M)
          if (( minute < 15 )); then
            echo "minute $minute: the hour is still reachable, deploying now"
            exit 0
          fi
          seconds=$(( (60 - minute) * 60 - $(date -u +%-S) ))
          echo "minute $minute: waiting ${seconds}s so the deploy lands on the hour"
          sleep "$seconds"

      - name: Deploy
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "root@${VPS_HOST}" "DEPLOY_SHA='${DEPLOY_SHA}' bash -s" <<'REMOTE'
          set -Eeuo pipefail

          root=/root/opt/mm-standx
          : "${DEPLOY_SHA:?the deploy needs the commit it is publishing}"

          test -f "$root/docker-compose.yml" || {
            echo "missing $root/docker-compose.yml" >&2
            exit 1
          }
          # Ключ кошелька остаётся единственным, что живёт на сервере руками.
          test -f "$root/.env" || {
            echo "missing $root/.env" >&2
            exit 1
          }
          test -f "$root/config.incoming/config.yaml" || {
            echo "missing $root/config.incoming/config.yaml: upload did not land" >&2
            exit 1
          }

          # Снимок действующей конфигурации снимается до подмены: откат на
          # предыдущий образ со сломавшей старт конфигурацией не откат.
          rm -rf "$root/config.previous"
          if [[ -d "$root/config" ]]; then
            cp -a "$root/config" "$root/config.previous"
          fi
          rm -rf "$root/config"
          mv "$root/config.incoming" "$root/config"

          # Каталог лога создаётся здесь, а не руками при заведении сервера:
          # отсутствующий источник bind-mount Docker создаёт сам и делает
          # владельцем root, после чего процесс под uid 10001 писать в него
          # не может. Отказ при этом тихий по замыслу — бот продолжает работать
          # с одним stdout, — и обнаружился бы ровно тогда, когда за файлом
          # придут: во время разбора происшествия.
          mkdir -p "$root/logs"
          chown 10001:10001 "$root/logs"

          # Снимок того, что работает сейчас, — для отката. Берётся с самого
          # контейнера, а не с тега: тег к этому моменту уже может означать
          # что угодно, а контейнер — это буквально то, что торгует.
          previous_image="$(docker inspect --format '{{.Image}}' mmbot \
            2>/dev/null || true)"
          previous_revision="$(docker inspect --format \
            '{{with index .Config.Labels "org.opencontainers.image.revision"}}{{.}}{{end}}' \
            mmbot 2>/dev/null || true)"
          echo "currently running: ${previous_revision:-unknown revision} ($previous_image)"

          # Образ закрепляется на коммит. compose подставляет это в
          # image: lutogin/mm-standx:${MM_IMAGE_TAG:-latest}.
          export MM_IMAGE_TAG="sha-${DEPLOY_SHA}"

          # Откатывается пара целиком — образ и конфигурация. Порознь они
          # не совпадают: сломать старт способна любая из двух половин, и
          # старый бинарь с новым файлом — такое же несочетание, как наоборот.
          #
          # Вынесено в функцию, потому что путей неудачи теперь два: не встал
          # healthcheck и не совпал образ. Второй наступает уже ПОСЛЕ подмены
          # конфигурации, поэтому выйти из него без отката значило бы оставить
          # на сервере ровно то несочетание, от которого этот блок и заведён.
          rollback() {
            if [[ -d "$root/config.previous" ]]; then
              rm -rf "$root/config"
              mv "$root/config.previous" "$root/config"
              echo "configuration rolled back to the previous version" >&2
            fi
            if [[ -n "$previous_image" ]]; then
              # Отдельный локальный тег, а НЕ latest. Прежняя версия делала
              # `docker tag <старый> latest`, после чего локальный latest
              # расходился с реестром и сервер начинал врать о том, что этот
              # тег означает. Откат обязан быть обратим и виден, а не
              # переписывать общую вывеску.
              docker tag "$previous_image" lutogin/mm-standx:rollback
              MM_IMAGE_TAG=rollback docker compose --project-directory "$root" \
                up -d --force-recreate mmbot
              echo "rolled back to ${previous_revision:-$previous_image}" >&2
            fi
            exit 1
          }

          docker compose --project-directory "$root" pull mmbot
          docker compose --project-directory "$root" \
            up -d --remove-orphans mmbot

          # УТВЕРЖДЕНИЕ, А НЕ НАДЕЖДА: контейнер обязан работать ровно на том
          # коммите, который только что опубликован.
          #
          # Сам по себе конвейер верен — `compose pull` идёт в реестр, а `up -d`
          # пересоздаёт контейнер, когда идентификатор образа сменился. Но
          # тег `latest` подвижен, и все способы промахнуться мимо него тихие:
          # неудавшийся pull при живом локальном образе, откат предыдущего
          # деплоя, оставивший старый образ под этим тегом, ручной `up -d`
          # на сервере. Ни один из них не оставляет следа в логе выкатки.
          #
          # Цена молчания измерена. Конфигурацию на сервере правили 18 августа
          # в 16:35 UTC, процесс был поднят сутками раньше и читает файл только
          # при старте: правка не действовала и об этом никто не узнал, потому
          # что спросить было нечего. Проверка стоит одного docker inspect.
          published="lutogin/mm-standx:${MM_IMAGE_TAG}"
          expected="$(docker image inspect "$published" --format '{{.Id}}')"
          running="$(docker inspect --format '{{.Image}}' mmbot)"
          if [[ "$expected" != "$running" ]]; then
            echo "deployed image does not match the published commit" >&2
            echo "  expected $expected ($published)" >&2
            echo "  running  $running" >&2
            docker inspect --format \
              'label revision: {{with index .Config.Labels "org.opencontainers.image.revision"}}{{.}}{{else}}none{{end}}' \
              "$running" >&2 || true
            rollback
          fi
          echo "container is running the published image ($published)"

          for _ in $(seq 1 60); do
            status="$(docker inspect --format '{{.State.Health.Status}}' mmbot \
              2>/dev/null || true)"
            if [[ "$status" == "healthy" ]]; then
              # Локальный latest приводится к выкаченному образу.
              #
              # Деплой тянет sha-<commit> и latest больше не обновляет, так что
              # без этой строки тег на сервере остался бы указывать на прежний
              # образ — а именно он подставляется умолчанием
              # ${MM_IMAGE_TAG:-latest}, когда на сервере руками делают
              # `docker compose up -d`. Молчаливый откат на старый образ через
              # ручную команду — ровно та ловушка, ради закрытия которой
              # образ и закрепляли.
              #
              # Только после healthcheck: тег обязан означать «этот образ
              # работал», а не «этот образ пробовали запустить».
              docker tag "$published" lutogin/mm-standx:latest
              echo "deployed ${DEPLOY_SHA} and healthy"
              exit 0
            fi
            if [[ "$status" == "unhealthy" ]]; then
              break
            fi
            sleep 2
          done

          docker compose --project-directory "$root" \
            logs --no-color --tail=100 mmbot >&2 || true
          rollback
          REMOTE
